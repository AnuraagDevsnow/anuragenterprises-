      <!-- Subtle Quick Date Shortcuts & Snapshot Actions -->

        <div class="flex items-center gap-2">

          <input

            type="text"
            placeholder="DD/MM/YYYY"
            class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-950 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />

    <!-- Results Summary Strip -->
    <div id="resultsMeta" class="hidden flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 dark:text-zinc-400 px-1">

        <span id="cacheAgeTag" class="px-2 py-0.5 rounded bg-sky-500/10 text-[11px] text-sky-700 dark:text-sky-300"></span>

        <button id="refreshLiveBtn" type="button" class="underline hover:text-emerald-600 dark:hover:text-emerald-400 cursor-pointer">Refresh Live</button>
        <button id="copySnapshotBtn" type="button" class="underline hover:text-emerald-600 dark:hover:text-emerald-400 cursor-pointer">Copy Text</button>

        Hide

    <!-- Compact Control Card -->

      <!-- Saved Presets Bar -->

        <div id="presetsList" class="flex flex-wrap items-center gap-1.5">
          <!-- Presets rendered dynamically -->
        </div>
        <div class="flex items-center gap-1.5">
          <input
            id="presetNameInput"
            type="text"
            maxlength="24"
            placeholder="Preset name..."
            class="w-32 sm:w-36 px-2.5 py-1 text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-950 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
          <button
            id="savePresetBtn"
            type="button"
            class="px-2.5 py-1 rounded-lg text-xs font-medium bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 hover:opacity-90 transition-opacity cursor-pointer"
          >
            + Save
          </button>
        </div>
      </div>

      <!-- Multi-Select Topic Pills -->
      <div id="topicsContainer" class="flex flex-wrap gap-1.5">
        <!-- Topic chips rendered dynamically -->
      </div>

      <!-- Keyword, Historical Date, Sort & Scour Action -->
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <input
          id="keywordInput"
          type="text"

        <!-- Historical Date Input + Quick 20/11/2020 & Today helper -->
        <div class="sm:col-span-3 relative flex items-center">
          <input
            id="dateInput"
            type="text"
            placeholder="Today (or 20/11/2020)"

          <option value="hot">Hot</option>

            <path d="m21 21-4.3-4.3"></path>

      <!-- Subtle Quick Date Shortcuts -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-zinc-400 pt-0.5">
        <div class="flex flex-wrap items-center gap-2">
          <span>Quick dates:</span>
          <button id="quickTodayBtn" type="button" class="underline hover:text-emerald-600 dark:hover:text-emerald-400 cursor-pointer">Today</button>
          <span>•</span>
          <button id="quickArchiveBtn" type="button" class="underline hover:text-emerald-600 dark:hover:text-emerald-400 cursor-pointer">20/11/2020</button>

    <div id="resultsMeta" class="hidden flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400 px-1">

        <strong id="totalResultsCount" class="text-slate-800 dark:text-zinc-200">0</strong> headlines

      <span id="sourceTag" class="text-[11px]"></span>
    </div>

    <!-- Headlines List -->
    <section id="feedContainer" class="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40 divide-y divide-slate-200/80 dark:divide-zinc-800/80 overflow-hidden">

        <p class="text-sm font-medium">No fetch run yet</p>
        <p class="text-xs text-slate-500 dark:text-zinc-400">

        <span>Scroll down or click to load more headlines...</span>

  <!-- Settings Modal (Optional Custom API Key) -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-xs">

      <div class="flex items-center justify-between border-b border-slate-100 dark:border-zinc-800 pb-3">
        <div>
          <h2 class="text-sm font-bold">Source & API Settings</h2>
          <p class="text-xs text-slate-500 dark:text-zinc-400">Keyless GDELT is active by default. Custom keys stay in your browser only.</p>
        </div>
        <button id="closeSettingsBtn" type="button" aria-label="Close settings" class="p-1 text-slate-400 hover:text-slate-700 dark:hover:text-zinc-200 cursor-pointer">
          ✕

      <div class="space-y-3">
        <div>

        <div id="apiKeyFieldWrap" class="hidden">

            Custom API Key (Stored Locally)

          <input
            id="apiKeyInput"
            type="password"
            autocomplete="off"

          />
        </div>

        <p id="apiKeyStatusNote" class="text-[11px] text-slate-500 dark:text-zinc-400">

        <div class="pt-2 border-t border-slate-100 dark:border-zinc-800 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-slate-700 dark:text-zinc-300">Muted Domains</span>

          </div>
          <div id="mutedDomainsList" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
            <!-- Muted domain chips rendered here -->
          </div>
        </div>
      </div>

      <!-- Install & Icon Setup Helper -->
      <div class="rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50/90 dark:bg-zinc-950/80 p-3 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-slate-800 dark:text-zinc-200">Install &amp; Icon Setup</span>
          <button
            id="copyManifestBtn"
            type="button"
            class="px-2 py-1 rounded-lg text-[11px] font-medium border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:border-emerald-500/60 text-slate-700 dark:text-zinc-200 transition-colors cursor-pointer"
          >
            Copy site.webmanifest
          </button>
        </div>
        <p class="text-[11px] leading-relaxed text-slate-500 dark:text-zinc-400">
          An inline radar SVG icon works right away. For full install/home-screen support, place
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">favicon.ico</code>,
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">apple-touch-icon.png</code>,
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">android-chrome-192x192.png</code>,
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">android-chrome-512x512.png</code>, and
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">site.webmanifest</code> in your repo root alongside
          <code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-zinc-800">index.html</code>.
        </p>
        <p id="manifestCopyFeedback" class="hidden text-[11px] font-medium text-emerald-600 dark:text-emerald-400"></p>
      </div>

      <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-zinc-800">
        <button id="clearCacheBtn" type="button" class="px-3 py-1.5 rounded-xl text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 cursor-pointer">
          Clear PC Cache
        </button>
        <div class="flex items-center gap-2">
          <button id="cancelSettingsBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 cursor-pointer">
            Cancel
          </button>
          <button id="saveSettingsBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

    // --- Shareable Link State ---
    function buildShareUrl() {
      const url = new URL(window.location.href);
      const params = new URLSearchParams();
      if (state.selectedTopics.length) params.set('topics', state.selectedTopics.join(','));
      const kw = $('keywordInput').value.trim();
      if (kw) params.set('q', kw);
      const dt = $('dateInput').value.trim();
      if (dt) params.set('date', dt);
      const fromDt = $('fromDateInput').value.trim();
      const toDt = $('toDateInput').value.trim();
      if (fromDt) params.set('from', fromDt);
      if (toDt) params.set('to', toDt);
      const sort = $('sortSelect').value;
      if (sort && sort !== 'relevant') params.set('sort', sort);
      url.search = params.toString();
      return url.toString();
    }

    function applyShareQueryParams() {
      try {
        const params = new URLSearchParams(window.location.search);
        const topicsParam = params.get('topics');
        if (topicsParam !== null) {
          const validIds = new Set(TOPICS.map((t) => t.id));
          state.selectedTopics = topicsParam
            .split(',')
            .map((s) => s.trim())
            .filter((id) => validIds.has(id));
        }
        const q = params.get('q');
        if (q) {
          $('keywordInput').value = q;
          state.keyword = q;
        }
        const dateParam = params.get('date');
        if (dateParam) $('dateInput').value = dateParam;

        const fromParam = params.get('from');
        const toParam = params.get('to');
        if (fromParam || toParam) {
          $('dateRangeRow').classList.remove('hidden');
          $('dateRangeRow').classList.add('grid');
          if (fromParam) $('fromDateInput').value = fromParam;
          if (toParam) $('toDateInput').value = toParam;
        }

        const sortParam = params.get('sort');
        if (sortParam && ['relevant', 'hot', 'old'].includes(sortParam)) {
          $('sortSelect').value = sortParam;
          state.sort = sortParam;
        }
      } catch (_) {}
    }

    function copyShareLink() {
      const link = buildShareUrl();
      try {
        window.history.replaceState({}, '', link);
      } catch (_) {}

      let copied = false;
      try {
        const temp = document.createElement('textarea');
        temp.value = link;
        temp.setAttribute('readonly', '');
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        copied = document.execCommand('copy');
        document.body.removeChild(temp);
      } catch (_) {
        copied = false;
      }

      setStatus(copied ? 'Shareable link copied to clipboard.' : `Share link ready: ${link}`, 'success');
    }

    function persistMutedDomains() {

    }

    function muteDomain(domain) {
      const clean = String(domain || '').toLowerCase().replace(/^www\./, '').trim();
      if (!clean) return;
      if (!state.mutedDomains.includes(clean)) {
        state.mutedDomains.push(clean);
        persistMutedDomains();
        renderMutedDomains();
      }
      if (state.rawFetchedItems.length) {
        reprocessCurrentArticles();
      }
      setStatus(`Muted domain "${clean}".`, 'info');
    }

    function unmuteDomain(domain) {
      const clean = String(domain || '').toLowerCase();
      state.mutedDomains = state.mutedDomains.filter((d) => d !== clean);
      persistMutedDomains();
      renderMutedDomains();
      if (state.rawFetchedItems.length) {

      }
    }

      badge.textContent = `${state.mutedDomains.length} muted`;

        chip.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-[11px] bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-200';

    // --- Date Parsing (DD/MM/YYYY + Range helper) ---
    function parseDateInput(rawVal) {
      const trimmed = (rawVal || '').trim();
      if (!trimmed) return { isArchive: false, dateObj: null, label: 'Today / Recent', error: '' };

      const match = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(trimmed);
      if (!match) {
        return {
          isArchive: false,
          dateObj: null,
          label: '',
          error: 'Use DD/MM/YYYY format (for example: 20/11/2020) or leave blank for Today.'
        };
      }

      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10);
      const year = parseInt(match[3], 10);

      const candidate = new Date(Date.UTC(year, month - 1, day, 12, 0, 0));
      const validCalendarDate =
        candidate.getUTCFullYear() === year &&
        candidate.getUTCMonth() === month - 1 &&
        candidate.getUTCDate() === day;

      if (!validCalendarDate || year < 2015 || year > 2100) {
        return {
          isArchive: false,
          dateObj: null,
          label: '',
          error: 'Enter a valid calendar date between 2015 and 2100 (e.g. 20/11/2020).'
        };
      }

      const dd = String(day).padStart(2, '0');
      const mm = String(month).padStart(2, '0');
      return {
        isArchive: true,
        dateObj: candidate,
        label: `${dd}/${mm}/${year}`,
        error: ''
      };
    }

    function parseRangeDates() {
      const fromRaw = $('fromDateInput').value.trim();
      const toRaw = $('toDateInput').value.trim();
      if (!fromRaw && !toRaw) {
        return { active: false, fromInfo: null, toInfo: null, error: '' };
      }
      if (!fromRaw || !toRaw) {
        return { active: false, fromInfo: null, toInfo: null, error: 'Enter both From and To dates in DD/MM/YYYY format.' };
      }

      const fromInfo = parseDateInput(fromRaw);
      if (fromInfo.error) return { active: false, fromInfo: null, toInfo: null, error: `From date: ${fromInfo.error}` };

      const toInfo = parseDateInput(toRaw);
      if (toInfo.error) return { active: false, fromInfo: null, toInfo: null, error: `To date: ${toInfo.error}` };

      if (fromInfo.dateObj.getTime() > toInfo.dateObj.getTime()) {
        return { active: false, fromInfo: null, toInfo: null, error: 'From date must be earlier than or equal to To date.' };
      }

      return { active: true, fromInfo, toInfo, error: '' };
    }

    function formatGdeltDateStamp(dateObj, endOfDay = false) {
      const y = dateObj.getUTCFullYear();
      const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getUTCDate()).padStart(2, '0');
      return `${y}${m}${d}${endOfDay ? '235959' : '000000'}`;
    }

    // --- User PC Local Cache ---
    function readLocalCache(cacheKey) {
      try {
        const raw = localStorage.getItem(STORAGE.CACHE);
        if (!raw) return null;
        const map = JSON.parse(raw);
        const entry = map[cacheKey];
        if (!entry) return null;
        const ageMs = Date.now() - (entry.savedAt || 0);
        if (ageMs > CACHE_TTL_MS) {
          delete map[cacheKey];
          localStorage.setItem(STORAGE.CACHE, JSON.stringify(map));
          return null;
        }
        return { articles: entry.articles || null, ageMs };
      } catch (_) {
        return null;
      }
    }

    function writeLocalCache(cacheKey, articles) {
      try {
        const raw = localStorage.getItem(STORAGE.CACHE);
        const map = raw ? JSON.parse(raw) : {};
        map[cacheKey] = { savedAt: Date.now(), articles };

        const keys = Object.keys(map);
        if (keys.length > MAX_CACHE_ENTRIES) {
          keys
            .sort((a, b) => (map[a].savedAt || 0) - (map[b].savedAt || 0))
            .slice(0, keys.length - MAX_CACHE_ENTRIES)
            .forEach((k) => delete map[k]);
        }

        localStorage.setItem(STORAGE.CACHE, JSON.stringify(map));
      } catch (_) {}
    }

    function formatCacheAge(ageMs) {
      const mins = Math.max(0, Math.floor(ageMs / 60000));
      if (mins < 1) return 'Cached <1m ago';
      if (mins < 60) return `Cached ${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return `Cached ${hrs}h ago`;
    }

    // --- Fetching & Ranking on User PC ---
    function buildQueryTerms() {
      const selectedObjs = TOPICS.filter((t) => state.selectedTopics.includes(t.id));
      const keyword = state.keyword.trim();

      const parts = selectedObjs.map((t) => t.gdeltQuery);
      if (keyword) {
        const safeKw = keyword.replace(/"/g, '').trim();
        if (safeKw) {
          parts.push(safeKw.includes(' ') ? `"${safeKw}"` : safeKw);
        }
      }

      if (!parts.length) {
        return '(news OR technology OR economy OR science)';
      }
      return parts.length === 1 ? parts[0] : `(${parts.join(' OR ')})`;
    }

    async function fetchWithTimeout(url, timeoutMs = REQUEST_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        return await res.json();
    async function fetchFromGdelt(queryText, dateInfo, rangeInfo) {
      const params = new URLSearchParams({
        query: `${queryText} sourcelang:english`,
        mode: 'artlist',
        maxrecords: '80',
        format: 'json',
        sort: 'DateDesc'
      });

      if (rangeInfo && rangeInfo.active) {
        const startDay = new Date(Date.UTC(rangeInfo.fromInfo.dateObj.getUTCFullYear(), rangeInfo.fromInfo.dateObj.getUTCMonth(), rangeInfo.fromInfo.dateObj.getUTCDate()));
        const endDay = new Date(Date.UTC(rangeInfo.toInfo.dateObj.getUTCFullYear(), rangeInfo.toInfo.dateObj.getUTCMonth(), rangeInfo.toInfo.dateObj.getUTCDate()));
        params.set('startdatetime', formatGdeltDateStamp(startDay, false));
        params.set('enddatetime', formatGdeltDateStamp(endDay, true));
      } else if (dateInfo.isArchive && dateInfo.dateObj) {
        params.set('startdatetime', formatGdeltDateStamp(dateInfo.dateObj, false));
        params.set('enddatetime', formatGdeltDateStamp(dateInfo.dateObj, true));
      }

      const data = await fetchWithTimeout(`https://api.gdeltproject.org/api/v2/doc/doc?${params.toString()}`);
      const list = Array.isArray(data.articles) ? data.articles : [];

      return list
        .filter((item) => item && item.title && item.url)
        .map((item) => ({
          title: String(item.title).trim(),
          snippet: item.seendate ? `Source: ${domainFromUrl(item.url)}` : '',
          domain: item.domain ? String(item.domain).replace(/^www\./, '') : domainFromUrl(item.url),
          publishedAt: parseGdeltTimestamp(item.seendate),
          url: String(item.url)
        }));
    }

    async function fetchFromCustomProvider(queryText) {
      const { provider, apiKey } = state.apiConfig;
      const cleanQ = queryText.replace(/[()"]/g, '').replace(/\s+OR\s+/g, ' ').slice(0, 100).trim() || 'news';

      if (provider === 'newsdata') {
        const url = `https://newsdata.io/api/1/latest?apikey=${encodeURIComponent(apiKey)}&q=${encodeURIComponent(cleanQ)}&language=en`;
        const data = await fetchWithTimeout(url);
        const rows = Array.isArray(data.results) ? data.results : [];
        return rows
          .filter((r) => r && r.title && r.link)
          .map((r) => ({
            title: String(r.title).trim(),
            snippet: r.description ? String(r.description).trim() : '',
            domain: r.source_id ? String(r.source_id) : domainFromUrl(r.link),
            publishedAt: r.pubDate ? Date.parse(r.pubDate) || Date.now() : Date.now(),
            url: String(r.link)
          }));
      }

      if (provider === 'gnews') {
        const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(cleanQ)}&lang=en&max=50&apikey=${encodeURIComponent(apiKey)}`;
        const data = await fetchWithTimeout(url);
        const rows = Array.isArray(data.articles) ? data.articles : [];
        return rows
          .filter((r) => r && r.title && r.url)
          .map((r) => ({
            title: String(r.title).trim(),
            snippet: r.description ? String(r.description).trim() : '',
            domain: r.source && r.source.name ? String(r.source.name) : domainFromUrl(r.url),
            publishedAt: r.publishedAt ? Date.parse(r.publishedAt) || Date.now() : Date.now(),
            url: String(r.url)
          }));
      }

      return [];
    }

    function buildMatchingFallback(dateInfo, keyword) {
      const kw = keyword.trim().toLowerCase();
      const activeTopics = state.selectedTopics;

      const filtered = FALLBACK_HEADLINES.filter((item) => {
        const topicMatch = !activeTopics.length || activeTopics.includes(item.topic);
        const kwMatch =
          !kw ||
          item.title.toLowerCase().includes(kw) ||
          (item.snippet && item.snippet.toLowerCase().includes(kw));
        return topicMatch && kwMatch;
      });

      const pool = filtered.length ? filtered : FALLBACK_HEADLINES;
      if (dateInfo.isArchive && dateInfo.dateObj) {
        const archiveMs = dateInfo.dateObj.getTime();
        return pool.map((item, idx) => ({
          ...item,
          title: `${item.title} (${dateInfo.label})`,
          publishedAt: archiveMs - idx * 1000 * 60 * 15
        }));
      }
      return pool;
    }

    function scoreRelevance(article, keyword) {
      const text = `${article.title} ${article.snippet || ''}`.toLowerCase();
      let score = 0;

      const selectedObjs = TOPICS.filter((t) => state.selectedTopics.includes(t.id));
      selectedObjs.forEach((topic) => {
        topic.terms.forEach((term) => {
          if (text.includes(term)) score += 2;
        });
      });

      if (keyword) {
        const cleanKw = keyword.trim().toLowerCase();
        if (cleanKw && text.includes(cleanKw)) score += 8;
      }

      const ageHours = Math.max(0, (Date.now() - (article.publishedAt || Date.now())) / (1000 * 3600));
      score += Math.max(0, 6 - ageHours / 12);

      return score;
    }

    function deduplicateAndSort(rawArticles, sortMode, keyword) {
      const mutedSet = new Set(state.mutedDomains.map((d) => d.toLowerCase()));
      const seenUrls = new Set();
      const clusters = [];

      for (const item of rawArticles) {
        const cleanDomain = (item.domain || domainFromUrl(item.url || '')).toLowerCase().replace(/^www\./, '');
        if (mutedSet.has(cleanDomain)) continue;

        const normUrl = (item.url || '').split('?')[0].toLowerCase();
        if (normUrl && seenUrls.has(normUrl)) continue;
        if (normUrl) seenUrls.add(normUrl);

        const normTitle = item.title
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!normTitle) continue;

        const tokens = new Set(normTitle.split(' ').filter((t) => t.length > 3));
        const candidate = {
          ...item,
          domain: cleanDomain,
          _score: scoreRelevance(item, keyword),
          _tokens: tokens,
          similarSources: []
        };

        // Group near-duplicate coverage under primary story while keeping count
        let matchedCluster = null;
        for (const group of clusters) {
          if (group.normTitle === normTitle || tokenOverlap(group._tokens, tokens) >= 0.65) {
            matchedCluster = group;
            break;
          }
        }

        if (matchedCluster) {
          matchedCluster.similarSources.push({
            domain: candidate.domain,
            url: candidate.url,
            title: candidate.title
          });
        } else {
          clusters.push(candidate);
        }
      }

      if (sortMode === 'hot') {
        clusters.sort((a, b) => (b.publishedAt || 0) - (a.publishedAt || 0) || b._score - a._score);
      } else if (sortMode === 'old') {
        clusters.sort((a, b) => (a.publishedAt || 0) - (b.publishedAt || 0));
      } else {
        clusters.sort((a, b) => b._score - a._score || (b.publishedAt || 0) - (a.publishedAt || 0));
      }

      return clusters;
    }

    function tokenOverlap(setA, setB) {
      if (!setA.size || !setB.size) return 0;
      let shared = 0;
      setA.forEach((tok) => {
        if (setB.has(tok)) shared += 1;
      });
      return shared / Math.min(setA.size, setB.size);
    }

    function reprocessCurrentArticles() {
      const processed = deduplicateAndSort(state.rawFetchedItems, state.sort, state.keyword);
      state.articles = processed;
      state.rendered = 0;
      $('feedContainer').innerHTML = '';
      $('shownCount').textContent = '0';
      $('totalResultsCount').textContent = String(processed.length);
      if (processed.length) {
        renderNextBatch();
      } else {
        $('feedContainer').innerHTML = `
          <div class="p-8 text-center space-y-1">
            <p class="text-sm font-medium">No visible headlines after filtering/muting</p>
            <p class="text-xs text-slate-500 dark:text-zinc-400">Adjust muted domains or run a fresh scour.</p>
          </div>
        `;
        $('scrollSentinel').classList.add('hidden');
      }
    }

    function copyTextToClipboard(text) {
      try {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.setAttribute('readonly', '');
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(temp);
        return ok;
      } catch (_) {
        return false;
      }
    }

    function renderNextBatch() {
      const container = $('feedContainer');
      const start = state.rendered;
      const nextSlice = state.articles.slice(start, start + PAGE_SIZE);

      if (!nextSlice.length) return;

      nextSlice.forEach((art, idx) => {
        const rank = start + idx + 1;
        const row = document.createElement('article');
        row.className = 'p-3.5 sm:px-4 hover:bg-slate-50/90 dark:hover:bg-zinc-900/80 transition-colors';
        const extraCount = Array.isArray(art.similarSources) ? art.similarSources.length : 0;

        row.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 space-y-1">
              <div class="flex flex-wrap items-center gap-1.5 text-[11px] text-slate-500 dark:text-zinc-400">
                <span class="font-mono text-slate-400 dark:text-zinc-500">#${rank}</span>
                <span class="font-medium text-emerald-700 dark:text-emerald-400">${esc(art.domain)}</span>
                <span>•</span>
                <span>${esc(formatDate(art.publishedAt))}</span>
                ${
                  extraCount > 0
                    ? `<span class="px-1.5 py-0.2 rounded bg-slate-100 dark:bg-zinc-800 text-[10px] text-slate-600 dark:text-zinc-300">+${extraCount} similar</span>`
                    : ''
                }
              </div>
              <a
                href="${esc(art.url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="block text-sm sm:text-[15px] font-semibold leading-snug text-slate-900 dark:text-zinc-100 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors"
              >
                ${esc(art.title)}
              </a>
              ${
                art.snippet
                  ? `<p class="text-xs text-slate-500 dark:text-zinc-400 line-clamp-2">${esc(art.snippet)}</p>`
                  : ''
              }
              <div class="flex items-center gap-3 pt-0.5 text-[11px]">
                <button type="button" data-copy-url="${esc(art.url)}" class="copy-item-btn text-slate-500 dark:text-zinc-400 hover:text-emerald-600 dark:hover:text-emerald-400 cursor-pointer">
                  Copy link
                </button>
                <button type="button" data-mute-domain="${esc(art.domain)}" class="mute-item-btn text-slate-500 dark:text-zinc-400 hover:text-rose-500 cursor-pointer">
                  Mute ${esc(art.domain)}
                </button>
              </div>
            </div>
            <a
              href="${esc(art.url)}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open article"
              class="shrink-0 mt-1 text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 text-xs"
            >
              ↗
            </a>
          </div>
        `;

        const copyBtn = row.querySelector('.copy-item-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            const ok = copyTextToClipboard(art.url);
            setStatus(ok ? 'Headline link copied.' : `Link: ${art.url}`, 'info');
          });
        }

        const muteBtn = row.querySelector('.mute-item-btn');
        if (muteBtn) {
          muteBtn.addEventListener('click', () => muteDomain(art.domain));
        }

        container.appendChild(row);
      });

      state.rendered += nextSlice.length;
      updatePaginationUI();
    }
    async function scourNews(forceLive = false) {
      if (state.loading) return;

      const dateInfo = parseDateInput($('dateInput').value);
      if (dateInfo.error) {
        setStatus(dateInfo.error, 'warn');
        return;
      }

      const rangeInfo = parseRangeDates();
      if (rangeInfo.error) {
        setStatus(rangeInfo.error, 'warn');
        return;
      }

      state.keyword = $('keywordInput').value.trim();
      state.sort = $('sortSelect').value;
      clearStatus();
      setLoading(true);
      state.loading = true;

      const queryText = buildQueryTerms();
      const rangeTag = rangeInfo.active ? `${rangeInfo.fromInfo.label} - ${rangeInfo.toInfo.label}` : dateInfo.label;
      const cacheKey = `${state.apiConfig.provider}|${state.selectedTopics.slice().sort().join(',')}|${state.keyword.toLowerCase()}|${rangeTag}`;

      try {
        const cached = !forceLive ? readLocalCache(cacheKey) : null;
        let rawItems = cached ? cached.articles : null;
        let usedCache = Boolean(rawItems);
        let sourceLabel = usedCache ? 'Local PC Cache' : 'Live Feed';
        let cacheAgeText = usedCache ? formatCacheAge(cached.ageMs) : 'Fresh fetch';

        if (!rawItems) {
          try {
            if (!dateInfo.isArchive && !rangeInfo.active && state.apiConfig.provider !== 'gdelt' && state.apiConfig.apiKey) {
              rawItems = await fetchFromCustomProvider(queryText);
              sourceLabel = state.apiConfig.provider === 'newsdata' ? 'NewsData.io' : 'GNews.io';
            } else {
              rawItems = await fetchFromGdelt(queryText, dateInfo, rangeInfo);
              sourceLabel = rangeInfo.active
                ? `GDELT Range (${rangeTag})`
                : dateInfo.isArchive
                  ? `GDELT Archive (${dateInfo.label})`
                  : 'GDELT DOC 2.0';
            }

            if (Array.isArray(rawItems) && rawItems.length) {
              writeLocalCache(cacheKey, rawItems);
              cacheAgeText = 'Fresh fetch';
            } else {
              rawItems = buildMatchingFallback(dateInfo, state.keyword);
              sourceLabel = 'Local Sample Set';
              cacheAgeText = 'Sample fallback';
            }
          } catch (_) {
            rawItems = buildMatchingFallback(dateInfo, state.keyword);
            sourceLabel = 'Local Sample Set';
            cacheAgeText = 'Sample fallback';
          }
        }

        state.rawFetchedItems = Array.isArray(rawItems) ? rawItems : [];
        const processed = deduplicateAndSort(state.rawFetchedItems, state.sort, state.keyword);
        state.articles = processed;
        state.rendered = 0;

        $('feedContainer').innerHTML = '';
        $('resultsMeta').classList.remove('hidden');
        $('dateTag').textContent = rangeTag;
        $('cacheAgeTag').textContent = cacheAgeText;
        $('sourceTag').textContent = sourceLabel;

        try {
          window.history.replaceState({}, '', buildShareUrl());
        } catch (_) {}

        if (!processed.length) {
          $('feedContainer').innerHTML = `
            <div class="p-8 text-center space-y-1">
              <p class="text-sm font-medium">No matching headlines found</p>
              <p class="text-xs text-slate-500 dark:text-zinc-400">Try another topic, clear the keyword, or switch the date.</p>
            </div>
          `;
          $('scrollSentinel').classList.add('hidden');
          $('shownCount').textContent = '0';
          $('totalResultsCount').textContent = '0';
        } else {
          renderNextBatch();
          if (usedCache) {
            setStatus(`Loaded ${processed.length} headlines instantaneously (${cacheAgeText}).`, 'info');
          }
        }
      } finally {
        setLoading(false);
        state.loading = false;
      }
    }

    function copySnapshotText() {
      if (!state.articles.length) {
        setStatus('Run a search first to copy a headline snapshot.', 'warn');
        return;
      }
      const lines = state.articles.map((a, i) => `${i + 1}. ${a.title} (${a.domain}) - ${a.url}`);
      const ok = copyTextToClipboard(lines.join('\n'));
      setStatus(ok ? `Copied ${state.articles.length} headlines as text.` : 'Could not copy snapshot text.', 'success');
    }

    function exportSnapshotJson() {
      if (!state.articles.length) {
        setStatus('Run a search first to export JSON.', 'warn');
        return;
      }
      try {
        const payload = {
          app: 'Anurag news v2',
          exportedAt: new Date().toISOString(),
          count: state.articles.length,
          headlines: state.articles.map(({ _tokens, ...rest }) => rest)
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'anurag-news-snapshot.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setStatus(`Exported ${state.articles.length} headlines as JSON.`, 'success');
      } catch (_) {
        setStatus('JSON export is not supported in this browser frame.', 'warn');
      }
    }

    async function scourNews() {
      if (state.loading) return;

      const dateInfo = parseDateInput($('dateInput').value);
      if (dateInfo.error) {
        setStatus(dateInfo.error, 'warn');
        return;
      }

      state.keyword = $('keywordInput').value.trim();
      state.sort = $('sortSelect').value;
      clearStatus();
      setLoading(true);
      state.loading = true;

      const queryText = buildQueryTerms();
      const cacheKey = `${state.apiConfig.provider}|${state.selectedTopics.slice().sort().join(',')}|${state.keyword.toLowerCase()}|${dateInfo.label}`;

      try {
        let rawItems = readLocalCache(cacheKey);
        let usedCache = Boolean(rawItems);
        let sourceLabel = usedCache ? 'Local PC Cache' : 'Live Feed';

        if (!rawItems) {
          try {
            if (!dateInfo.isArchive && state.apiConfig.provider !== 'gdelt' && state.apiConfig.apiKey) {
              rawItems = await fetchFromCustomProvider(queryText);
              sourceLabel = state.apiConfig.provider === 'newsdata' ? 'NewsData.io' : 'GNews.io';
            } else {
              rawItems = await fetchFromGdelt(queryText, dateInfo);
              sourceLabel = dateInfo.isArchive ? `GDELT Archive (${dateInfo.label})` : 'GDELT DOC 2.0';
            }

            if (Array.isArray(rawItems) && rawItems.length) {
              writeLocalCache(cacheKey, rawItems);
            } else {
              rawItems = buildMatchingFallback(dateInfo, state.keyword);
              sourceLabel = 'Local Sample Set';
            }
          } catch (_) {
            rawItems = buildMatchingFallback(dateInfo, state.keyword);
            sourceLabel = 'Local Sample Set';
          }
        }

        const processed = deduplicateAndSort(rawItems, state.sort, state.keyword);
        state.articles = processed;
        state.rendered = 0;

        $('feedContainer').innerHTML = '';
        $('resultsMeta').classList.remove('hidden');
        $('dateTag').textContent = dateInfo.label;
        $('sourceTag').textContent = sourceLabel;

        if (!processed.length) {
          $('feedContainer').innerHTML = `
            <div class="p-8 text-center space-y-1">
              <p class="text-sm font-medium">No matching headlines found</p>
              <p class="text-xs text-slate-500 dark:text-zinc-400">Try another topic, clear the keyword, or switch the date.</p>
            </div>
          `;
          $('scrollSentinel').classList.add('hidden');
          $('shownCount').textContent = '0';
          $('totalResultsCount').textContent = '0';
        } else {
          renderNextBatch();
          if (usedCache) {
            setStatus(`Loaded ${processed.length} headlines instantaneously from your PC cache.`, 'info');
          }
        }
      } finally {
        setLoading(false);
        state.loading = false;
      }
    }

    function setupObserver() {
      const sentinel = $('scrollSentinel');
      if (!sentinel || typeof IntersectionObserver === 'undefined') return;

      if (state.observer) state.observer.disconnect();
      state.observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && !state.loading && state.rendered < state.articles.length) {
              renderNextBatch();
            }
          });
        },
        { rootMargin: '160px' }
      );
      state.observer.observe(sentinel);
    }

    function bindEvents() {
      $('themeToggleBtn').addEventListener('click', toggleTheme);
      $('dismissBannerBtn').addEventListener('click', clearStatus);
      $('savePresetBtn').addEventListener('click', saveCurrentPreset);

      $('presetNameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveCurrentPreset();
      });

      $('keywordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') scourNews();
      });

      $('dateInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') scourNews();
      });

      $('calendarInput').addEventListener('change', (e) => {
        const val = e.target.value;
        if (!val) return;
        const parts = val.split('-');
        if (parts.length === 3) {
          $('dateInput').value = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      });

      $('quickTodayBtn').addEventListener('click', () => {
        $('dateInput').value = '';
        $('calendarInput').value = '';
        setStatus('Date set to Today / Recent. Click Scour News to fetch.', 'info');
      });

      $('quickArchiveBtn').addEventListener('click', () => {
        $('dateInput').value = '20/11/2020';
        $('calendarInput').value = '2020-11-20';
        setStatus('Archive date set to 20/11/2020. Click Scour News to fetch.', 'info');
      });

      $('toggleRangeBtn').addEventListener('click', () => {
        const row = $('dateRangeRow');
        const opening = row.classList.contains('hidden');
        row.classList.toggle('hidden', !opening);
        row.classList.toggle('grid', opening);
      });

      $('shareLinkBtn').addEventListener('click', copyShareLink);
      $('refreshLiveBtn').addEventListener('click', () => scourNews(true));
      $('copySnapshotBtn').addEventListener('click', copySnapshotText);
      $('exportJsonBtn').addEventListener('click', exportSnapshotJson);

      $('resetFiltersBtn').addEventListener('click', () => {
        state.selectedTopics = [];
        state.keyword = '';
        state.sort = 'relevant';
        $('keywordInput').value = '';
        $('dateInput').value = '';
        $('fromDateInput').value = '';
        $('toDateInput').value = '';
        $('calendarInput').value = '';
        $('sortSelect').value = 'relevant';
        renderTopics();
        try {
          window.history.replaceState({}, '', window.location.pathname);
        } catch (_) {}
        setStatus('Filters reset. Pick topics or a keyword and click Scour News.', 'info');
      });

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';
        if (isTyping) return;
        if (e.key === '/') {
          e.preventDefault();
          $('keywordInput').focus();
        } else if (e.key === 'r' || e.key === 'R') {
          $('resetFiltersBtn').click();
        }
      });

      $('sortSelect').addEventListener('change', () => {
        state.sort = $('sortSelect').value;
        if (state.rawFetchedItems.length) {
          reprocessCurrentArticles();
        }
      });

      $('scourBtn').addEventListener('click', () => scourNews(false));
      $('loadMoreBtn').addEventListener('click', renderNextBatch);

      $('openSettingsBtn').addEventListener('click', openSettingsModal);
      $('closeSettingsBtn').addEventListener('click', closeSettingsModal);
      $('cancelSettingsBtn').addEventListener('click', closeSettingsModal);
      $('saveSettingsBtn').addEventListener('click', saveSettingsModal);
      $('clearCacheBtn').addEventListener('click', clearLocalCache);
      $('providerSelect').addEventListener('change', toggleKeyField);
      $('copyManifestBtn').addEventListener('click', copyWebManifestSnippet);

      $('settingsModal').addEventListener('click', (e) => {
        if (e.target === $('settingsModal')) closeSettingsModal();
      });
    }

    function setLoading(isBusy) {
      $('scourBtn').disabled = isBusy;
      $('scourBtn').classList.toggle('opacity-75', isBusy);
      $('scourBtnText').textContent = isBusy ? 'Scouring...' : 'Scour News';
      $('scourSpinner').classList.toggle('animate-spin', isBusy);
    }

    function setStatus(msg, kind = 'info') {
      const banner = $('statusBanner');
      const dot = $('statusDot');
      banner.className = 'rounded-xl px-3.5 py-2 text-xs border flex items-center justify-between gap-2';

      if (kind === 'success') {
        banner.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-800', 'dark:text-emerald-300');
        dot.className = 'w-2 h-2 rounded-full shrink-0 bg-emerald-500';
      } else if (kind === 'warn') {
        banner.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-800', 'dark:text-amber-300');
        dot.className = 'w-2 h-2 rounded-full shrink-0 bg-amber-500';
      } else if (kind === 'error') {
        banner.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-800', 'dark:text-rose-300');
        dot.className = 'w-2 h-2 rounded-full shrink-0 bg-rose-500';
      } else {
        banner.classList.add('bg-slate-200/70', 'border-slate-300', 'text-slate-800', 'dark:bg-zinc-800', 'dark:border-zinc-700', 'dark:text-zinc-200');
        dot.className = 'w-2 h-2 rounded-full shrink-0 bg-sky-500';
      }

      $('statusText').textContent = msg;
    }

    function clearStatus() {
      $('statusBanner').classList.add('hidden');
    }

    function clearLocalCache() {
      try {
        localStorage.removeItem(STORAGE.CACHE);
      } catch (_) {}
      setStatus('Cleared cached news entries on your PC.', 'success');
    }

    function copyWebManifestSnippet() {
      const manifestJson = JSON.stringify(
        {
          name: 'Anurag news',
          short_name: 'Anurag news',
          start_url: './',
          display: 'standalone',
          theme_color: '#0f172a',
          background_color: '#0f172a',
          icons: [
            {
              src: './android-chrome-192x192.png',
              sizes: '192x192',
              type: 'image/png'
            },
            {
              src: './android-chrome-512x512.png',
              sizes: '512x512',
              type: 'image/png'
            }
          ]
        },
        null,
        2
      );

      const feedback = $('manifestCopyFeedback');
      let copied = false;

      try {
        const temp = document.createElement('textarea');
        temp.value = manifestJson;
        temp.setAttribute('readonly', '');
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        copied = document.execCommand('copy');
        document.body.removeChild(temp);
      } catch (_) {
        copied = false;
      }

      if (feedback) {
        feedback.textContent = copied
          ? 'Copied site.webmanifest JSON to clipboard!'
          : 'Could not auto-copy in this frame — save the manifest JSON in your repo root.';
        feedback.classList.remove('hidden');
      }
    }

    function parseGdeltTimestamp(s) {
      if (!s || s.length < 14) return Date.now();
      const y = parseInt(s.slice(0, 4), 10);
      const m = parseInt(s.slice(4, 6), 10) - 1;
      const d = parseInt(s.slice(6, 8), 10);
      const hh = parseInt(s.slice(9, 11), 10) || 0;
      const mm = parseInt(s.slice(11, 13), 10) || 0;
      const ss = parseInt(s.slice(13, 15), 10) || 0;
      return Date.UTC(y, m, d, hh, mm, ss);
    }

    function formatDate(ms) {
      const d = new Date(ms);
      if (isNaN(d.getTime())) return 'Recent';
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function domainFromUrl(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, '');
      } catch (_) {
        return 'source';
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
